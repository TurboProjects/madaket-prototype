<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Madaket — Contacts &amp; Campaigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,100..1000&amp;family=Montserrat:wght@300..700&amp;display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:light;
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Montserrat",var(--font);
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px; --r-sm:8px; --pill:999px;
  --mauve:#926C62; --rose:#B7877B; --sage:#A8BD9C; --signal:#E75344;
  --bg:#F2EEE7; --fg:#1B1B1B; --fg-soft:#4A4744;
  --card:#FCFBF8; --muted:#EDE8E0; --muted-fg:#6C6D6A;
  --border:rgba(27,27,27,.12); --border-s:rgba(27,27,27,.24);
  --accent:var(--mauve); --accent-ink:#fff; --accent-dark:#7E5B52; --accent-soft:rgba(146,108,98,.10);
  --focus:rgba(146,108,98,.38);
  --ok:#E6EDE0;   --ok-ink:#4A6B3D;
  --warn:#F6EBD9; --warn-ink:#8A5B0A;
  --bad:#F8E2DE;  --bad-ink:#A3372A;
  --neu:#EAE6DF;  --neu-ink:#6C6D6A;
  --info:#EFE6E3; --info-ink:#926C62;
  --shadow:0 1px 2px rgba(27,27,27,.05),0 10px 28px -12px rgba(27,27,27,.18);
  --shadow-lg:0 2px 8px rgba(27,27,27,.08),0 28px 60px -16px rgba(27,27,27,.28);
}
body{margin:0;font:14px/1.5 var(--font);background:var(--bg);color:var(--fg);
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.tabular{font-variant-numeric:tabular-nums}

/* ── shell ─────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100vh;overflow:hidden}
.app.nochat{grid-template-columns:236px minmax(0,1fr)}

/* rail */
.rail{background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;
  padding:16px 12px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .mk{width:38px;height:38px;object-fit:contain;flex:0 0 auto;margin:-3px 0}
.brand .nm{font-weight:650;font-size:14px;letter-spacing:-.01em}
.brand .sub{font-size:11px;color:var(--muted-fg);margin-top:-2px}
.mapwrap{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(240px,1fr);gap:16px;padding:16px 0}
.mapcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm,10px);box-shadow:var(--shadow);padding:14px}
.mapcard svg{width:100%;height:auto;display:block}
.mst{stroke:#fff;stroke-width:1;cursor:default}.mst.has{cursor:pointer}.mst:hover{stroke:#5b3b1c;stroke-width:1.5}.mst.sel{stroke:#3d2610;stroke-width:2}
.maplegend{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12px;color:var(--muted-fg);margin-top:8px}.maplegend i{width:22px;height:10px;display:inline-block;border-radius:2px}
.maprow{padding:8px 6px;border-bottom:1px solid var(--border);cursor:pointer}.maprow:hover{background:var(--muted)}
@media(max-width:800px){.mapwrap{grid-template-columns:1fr}}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 11px;border:0;border-radius:var(--r-sm);
  background:none;cursor:pointer;text-align:left;color:var(--fg-soft);font-size:13.5px;width:100%}
.nav button:hover{background:var(--muted);color:var(--fg)}
.nav button.on{background:var(--accent-soft);color:var(--fg);font-weight:650}
.nav .ico{width:18px;text-align:center;font-size:15px;flex:0 0 auto}
.nav .badge{margin-left:auto;background:var(--warn);color:var(--warn-ink);border-radius:var(--pill);
  padding:1px 7px;font-size:11px;font-weight:700}
.nav .inbox{background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);padding:10px 11px}
.nav .inbox.on{background:var(--accent-soft);border-color:var(--accent)}
.nav .inbox .lbl2{display:flex;flex-direction:column;line-height:1.2}
.nav .inbox .lbl2 small{font-size:11px;color:var(--muted-fg);font-weight:500}
.nav .navdiv{height:1px;background:var(--border);margin:10px 4px 8px}
.gatebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.gatebar .inp{flex:1 1 220px;min-width:180px}
.railfoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.railfoot .who{display:flex;align-items:center;gap:9px;padding:4px 8px;font-size:12.5px}
.railfoot .av{width:26px;height:26px;border-radius:var(--pill);background:var(--neu);color:var(--neu-ink);
  display:grid;place-items:center;font-size:11px;font-weight:700}
.iconrow{display:flex;gap:6px;justify-content:flex-end;padding:0 4px}
.iconbtn{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--border);background:transparent;border-radius:var(--r-sm);cursor:pointer;
  font-size:13px;color:var(--muted-fg);line-height:1}
.iconbtn:hover{border-color:var(--border-s);background:var(--muted);color:var(--fg)}
.tinybtn{border:1px solid var(--border);background:var(--card);border-radius:var(--r-sm);
  padding:6px 9px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:7px;justify-content:center}
.tinybtn:hover{border-color:var(--border-s);background:var(--muted)}

/* main */
.main{overflow-y:auto;background:var(--bg);scroll-behavior:smooth}
.head{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:18px 28px 0}
.head h1{margin:0;font-family:var(--display);font-size:22px;letter-spacing:-.01em;font-weight:400}
.head .lede{margin:4px 0 0;font-size:12.5px;color:var(--muted-fg);max-width:74ch}
.ptabs{display:flex;gap:2px;margin:14px 0 0;align-items:center}
.head-row{display:flex;align-items:center;gap:12px;min-height:32px}
.head-row .head-act{margin-left:auto;flex:none}
.ptab{border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--muted-fg);
  padding:8px 2px 10px;margin-right:22px;cursor:pointer;border-bottom:2px solid transparent;letter-spacing:-.01em}
.ptab:hover{color:var(--fg)}
.ptab.on{color:var(--accent);border-bottom-color:var(--accent)}
.ptab .n{font-size:11.5px;font-weight:600;color:var(--muted-fg);margin-left:6px;font-variant-numeric:tabular-nums}
.ptab.on .n{color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 0 13px}
/* one-row filter bar */
.fwrap{padding:14px 0 13px}
.fbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fbtn{border:1px solid var(--border);background:var(--card);border-radius:var(--pill);padding:6px 13px;
  font:inherit;font-size:12.5px;color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.fbtn:hover{border-color:var(--border-s);background:var(--muted)}
.fbtn.on{border-color:var(--border-s);background:var(--muted)}
.fbtn .fn{background:var(--fg);color:var(--bg);border-radius:var(--pill);padding:0 6px;font-size:11px;font-weight:700}
.fbtn .fcar{color:var(--muted-fg);font-size:10px}
.fpanel{margin-top:12px;border:1px solid var(--border);background:var(--card);border-radius:var(--r);
  box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:28px;flex-wrap:wrap}
.fgroup{min-width:190px;flex:0 1 auto}
.fgl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-fg);margin-bottom:6px}
.fopt{display:flex;width:100%;gap:12px;align-items:center;justify-content:space-between;border:0;background:transparent;
  color:var(--fg);font:inherit;font-size:12.5px;padding:5px 8px;border-radius:var(--r-sm);cursor:pointer;text-align:left}
.fopt:hover{background:var(--muted)}
.fopt.on{background:var(--accent-soft);font-weight:650}
.fopt .fnum{color:var(--muted-fg);font-variant-numeric:tabular-nums;font-weight:500}
.achips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px}
.achip{border:1px solid var(--border-s);background:var(--muted);border-radius:var(--pill);padding:4px 11px;
  font:inherit;font-size:12px;color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.achip .x{color:var(--muted-fg);font-size:13px;line-height:1}
.achip:hover .x{color:var(--fg)}
.clrall{border:0;background:transparent;color:var(--muted-fg);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
.clrall:hover{color:var(--fg)}
.body{padding:22px 28px 80px}

/* Linear-style filter chips */
.fwrap{position:relative}
.fchip{display:inline-flex;align-items:stretch;border:1px solid var(--border-s);background:var(--card);border-radius:var(--r-sm,7px);font-size:12.5px;overflow:hidden;max-width:100%}
.fbar{flex-wrap:nowrap;align-items:flex-start}
.fbar>.search{flex:none;width:230px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1 1 0;min-width:0}
.fend{flex:none;margin-left:auto;display:flex;gap:8px;align-items:center}
.fand{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg);padding:0 1px}
.fchip>button{border:0;background:transparent;font:inherit;color:var(--fg);cursor:pointer;white-space:nowrap;display:inline-flex;gap:5px;align-items:center;padding:5px 5px}
.fchip>button:hover{background:var(--muted)}
.fchip .fcp{padding-left:9px;font-weight:550}
.fchip .fco{color:var(--muted-fg)}
.fchip .fcv{max-width:260px;overflow:hidden;text-overflow:ellipsis;font-weight:650;padding-right:7px}
.fchip .fcv.miss{color:var(--bad-ink);font-weight:500;font-style:italic}
.fchip>button.on{background:var(--accent-soft)}
.fchip.bad{border-color:var(--bad-ink)}
.fpi mark{background:var(--accent-soft);color:inherit;border-radius:2px;padding:0 1px}
.fpi.cur{font-weight:650}
.fpi.none{cursor:default;color:var(--muted-fg);flex-direction:column;align-items:flex-start;gap:2px}
.fpi.none:hover{background:transparent}
.fkh{display:flex;gap:10px;justify-content:space-between;font-size:10.5px;color:var(--muted-fg);border-top:1px solid var(--border);margin-top:6px;padding:7px 4px 1px}
.fkh kbd,.gkbd{font:inherit;font-size:10px;border:1px solid var(--border-s);border-radius:4px;padding:0 4px;background:var(--muted)}
.fdd{position:relative;margin-bottom:10px}
.fddb{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border-s);background:var(--card);border-radius:var(--r-sm,7px);padding:7px 10px;font:inherit;font-size:13px;color:var(--fg);cursor:pointer}
.fddb:hover,.fddb.on{border-color:var(--fg)}
.fmenu{display:flex;flex-direction:column;padding:3px;border:1px solid var(--border);border-radius:var(--r-sm,7px);background:var(--card);max-height:260px;overflow:auto}
.fdd .fmenu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:3;box-shadow:0 10px 26px rgba(0,0,0,.16)}
.fom{display:flex;justify-content:space-between;gap:8px;border:0;background:transparent;font:inherit;font-size:12.5px;color:var(--fg);text-align:left;padding:6px 8px;border-radius:5px;cursor:pointer}
.fom:hover,.fom:focus{background:var(--muted);outline:none}
.fom.on{font-weight:650}
.fom.on::after{content:"✓"}
.fviews{display:flex;align-items:center;gap:2px;margin:0 0 8px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.fvt{border:0;background:transparent;font:inherit;font-size:12.5px;color:var(--muted-fg);padding:6px 10px 7px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.fvt:hover{color:var(--fg)}
.fvt.on{color:var(--fg);font-weight:650;border-bottom-color:var(--fg)}
.fvt .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle}
.fvact{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12px;padding-bottom:4px}
.fvact .inp{padding:4px 8px;font-size:12px;width:160px}
.fchip .fck{border:0;background:transparent;font:inherit;color:var(--fg);padding:5px 6px 5px 10px;cursor:pointer;display:inline-flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.fchip .fck:hover{background:var(--muted)}
.fchip .fck .op{color:var(--muted-fg)}
.fchip .fck b{font-weight:650}
.fchip .ty,.fpop .ty{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:4px;background:var(--muted);color:var(--muted-fg);font-size:10px;font-weight:700;padding:0 3px}
.fchip .fx{border:0;border-left:1px solid var(--border);background:transparent;color:var(--muted-fg);padding:0 9px;cursor:pointer;font-size:15px;line-height:1}
.fchip .fx:hover{color:var(--fg);background:var(--muted)}
.fchip.inc{border-style:dashed}
.fchip.act{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.fadd{border:1px dashed var(--border-s);background:transparent;border-radius:var(--r-sm,7px);padding:5px 11px;font:inherit;font-size:12.5px;color:var(--muted-fg);cursor:pointer}
.fadd:hover,.fadd.on{color:var(--fg);border-color:var(--fg);background:var(--muted)}
.fpop{position:absolute;z-index:70;width:280px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 14px 36px rgba(0,0,0,.18);padding:8px;text-align:left}
.fpop.wide{width:330px;padding:12px}
.fps{width:100%;box-sizing:border-box;border:0;border-bottom:1px solid var(--border);background:transparent;font:inherit;font-size:13px;padding:6px 6px 9px;outline:none;color:var(--fg)}
.fpl{max-height:320px;overflow:auto;margin-top:4px}
.fpg{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-fg);padding:9px 6px 4px}
.fpi{display:flex;gap:9px;align-items:center;width:100%;border:0;background:transparent;font:inherit;font-size:12.5px;color:var(--fg);padding:6px;border-radius:var(--r-sm,7px);cursor:pointer;text-align:left}
.fpi:hover,.fpi:focus{background:var(--muted);outline:none}
.fused{margin-left:auto;font-size:10.5px;color:var(--muted-fg)}
.fph{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:13px}
.fph .tyl{margin-left:auto;font-size:11px;color:var(--muted-fg)}
.fsel{width:100%;margin-bottom:10px}
.fve .inp{box-sizing:border-box}
.frow{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted-fg)}
.frow .inp{flex:1;min-width:0}
.fhint{font-size:11.5px;color:var(--muted-fg);margin-top:8px}
.fpre{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.chip.sm{padding:3px 9px;font-size:11.5px}
.fseg{display:flex;gap:6px}
.fcls{max-height:230px;overflow:auto;border:1px solid var(--border);border-radius:var(--r-sm,7px);padding:3px}
.fcl{display:flex;gap:9px;align-items:center;width:100%;border:0;background:transparent;font:inherit;font-size:12.5px;color:var(--fg);padding:6px 7px;border-radius:5px;cursor:pointer;text-align:left}
.fcl:hover{background:var(--muted)}
.fcl .bx{width:15px;height:15px;border:1.5px solid var(--border-s);border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:800;flex:none}
.fcl.on .bx{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.fcl .fnum{margin-left:auto;color:var(--muted-fg)}
.fpf{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.sbrow{border:1px solid var(--border);border-radius:var(--r);padding:10px;margin-bottom:8px}
.sbrow.bad{border-color:var(--bad-ink)}
.sbtop{display:grid;grid-template-columns:1.2fr 1fr 28px;gap:8px;align-items:center;margin-bottom:8px}
.sbtop .fsel{margin:0}

/* filter chips */
.chip{border:1px solid var(--border);background:var(--card);border-radius:var(--pill);padding:6px 13px;
  font-size:12.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--border-s);background:var(--muted)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.chip .n{opacity:.6;font-variant-numeric:tabular-nums}
.chip.on .n{opacity:.75}
.sep{width:1px;height:22px;background:var(--border);margin:0 3px}
.search{border:1px solid var(--border);background:var(--card);border-radius:var(--pill);padding:6px 14px;
  font:inherit;font-size:12.5px;color:var(--fg);min-width:210px;outline:none}
.search:focus{border-color:var(--accent)}

/* cards / generic */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.sect{margin:0 0 12px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-fg)}
.sect .hint{float:right;text-transform:none;letter-spacing:0;font-weight:500;font-size:11.5px;
  display:inline-flex;gap:7px;align-items:center;flex-wrap:wrap}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid3>.card{min-width:0;overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:1500px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* stat tiles */
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.stat .k{font-size:11.5px;color:var(--muted-fg);display:flex;align-items:center;gap:6px}
.stat .v{font-size:26px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .d{font-size:11.5px;color:var(--muted-fg);line-height:1.4}

/* badges */
.b{display:inline-flex;align-items:center;gap:5px;border-radius:var(--pill);padding:2px 9px;
  font-size:10.5px;font-weight:600;white-space:nowrap;line-height:1.7;letter-spacing:0}
.b-ok{background:var(--ok);color:var(--ok-ink)} .b-warn{background:var(--warn);color:var(--warn-ink)}
.b-bad{background:var(--bad);color:var(--bad-ink)} .b-neu{background:var(--neu);color:var(--neu-ink)}
.b-info{background:var(--info);color:var(--info-ink)}
.b .dot{width:6px;height:6px;border-radius:var(--pill);background:currentColor;flex:0 0 auto}

/* buttons */
.btn{border:1px solid var(--border);background:var(--card);border-radius:var(--r-sm);padding:8px 14px;
  font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--border-s);background:var(--muted)}
button.card{transition:border-color .12s,box-shadow .12s}
button.card:hover{border-color:var(--border-s);box-shadow:var(--shadow)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn.dang{background:var(--bad);color:var(--bad-ink);border-color:transparent;font-weight:600}
.btn.dang:hover{background:#F0CFC8}
.btn.sm{padding:5px 10px;font-size:12px}
.btn .kbd{background:color-mix(in srgb,currentColor 16%,transparent);border-radius:4px;padding:0 5px;
  font:600 10.5px/1.6 var(--mono)}
.kbdk{display:inline-block;border:1px solid var(--border-s);border-bottom-width:2px;border-radius:5px;
  padding:0 6px;font:600 11px/1.7 var(--mono);background:var(--muted);color:var(--fg-soft)}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted-fg);font-weight:700;padding:0 12px 9px}
table.t td .sub{overflow-wrap:anywhere}
table.t td{padding:11px 12px;border-top:1px solid var(--border);vertical-align:middle}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover td{background:var(--muted)}
.nm{font-weight:600} .sub{font-size:11.5px;color:var(--muted-fg)}
.wrap{overflow:auto;border-radius:var(--r);border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow)}
.wrap table.t th{padding-top:13px;background:var(--card)}

/* state machine strip */
.sm{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px;background:transparent}
.sm-node{padding:10px 10px;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);background:var(--card);min-width:0;
  display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left}
.sm-node:hover{background:var(--muted)}
.sm-node.on{background:var(--accent-soft);box-shadow:inset 0 -3px 0 var(--accent)}
.sm-node .s{font-size:12px;font-weight:650;display:flex;align-items:center;gap:6px}
.sm-node .c{font-size:20px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sm-node .w{font-size:11px;color:var(--muted-fg);line-height:1.35}
.sm-arrow{display:none}

/* confidence meter */
.conf{display:flex;align-items:center;gap:8px;min-width:132px}
.conf .bar{flex:1 1 auto;height:6px;border-radius:var(--pill);background:var(--neu);overflow:hidden;min-width:52px}
.conf .bar i{display:block;height:100%;border-radius:var(--pill)}
.conf .pc{font:650 11.5px/1 var(--mono);font-variant-numeric:tabular-nums;width:32px;text-align:right}
.c-hi{background:#4C8B2B} .c-md{background:#C08A16} .c-lo{background:#B4563A}

/* triage */
.tri-wrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:1240px){.tri-wrap{grid-template-columns:minmax(0,1fr)}}
.q{border:1px solid var(--border);border-radius:var(--r);background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
.q-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-fg)}
.q-item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;
  background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;align-items:flex-start}
.q-item:hover{background:var(--muted)}
.q-item.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.q-item.done{opacity:.5}
.q-item .chk{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--border-s);flex:0 0 auto;margin-top:2px;
  display:grid;place-items:center;font-size:10px;color:transparent}
.q-item.sel .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.q-item .t{font-size:12.5px;font-weight:600;line-height:1.35}
.q-item .m{font-size:11px;color:var(--muted-fg);margin-top:2px}
.detail{border:1px solid var(--border);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.detail-head{padding:16px 18px;border-bottom:1px solid var(--border)}
.detail-body{padding:18px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);gap:12px;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--border)}
.cmp:last-of-type{border-bottom:0}
.cmp .j{text-align:center;color:var(--muted-fg)}
.rec{border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 13px;background:var(--muted)}
.rec .nm{font-size:13px} .rec .ln{font-size:11.5px;color:var(--muted-fg);margin-top:2px;word-break:break-word}
.rec.win{border-color:var(--accent);background:var(--accent-soft)}
.why{background:var(--muted);border-radius:var(--r-sm);padding:12px 14px;font-size:12.5px;color:var(--fg-soft);line-height:1.55}
.why b{color:var(--fg)}
.actbar{display:flex;gap:9px;align-items:center;padding:14px 18px;border-top:1px solid var(--border);
  background:var(--muted);flex-wrap:wrap}
.actbar .rest{margin-left:auto;font-size:11.5px;color:var(--muted-fg)}
.bulkbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:11px 14px;
  border:1px solid var(--accent);border-radius:var(--r);background:var(--accent-soft);margin-bottom:12px;flex-wrap:wrap}

/* bundle steps */
.q-item.bun{box-shadow:inset 3px 0 0 var(--border-s)}
.q-item.bun.on{box-shadow:inset 3px 0 0 var(--accent)}
.bunpill{display:inline-flex;align-items:center;gap:5px;border-radius:var(--pill);padding:1px 8px;
  background:var(--muted);color:var(--muted-fg);font-size:10.5px;font-weight:700;border:1px solid var(--border);line-height:1.7}
.bunpill .st{font-size:11px;line-height:1}
.q-item.on .bunpill{background:var(--card);border-color:var(--border-s);color:var(--fg-soft)}
.roster{border:1px solid var(--border);border-radius:var(--r-sm);background:var(--muted);overflow:hidden}
.roster .rhead{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border);
  font-size:11.5px;color:var(--muted-fg)}
.roster .rscroll{max-height:268px;overflow:auto}
.rrow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:9px 12px;cursor:pointer;
  background:none;border:0;border-bottom:1px solid var(--border)}
.rrow:last-child{border-bottom:0}
.rrow:hover{background:var(--card)}
.rrow.cur{background:var(--accent-soft)}
.rrow.out{opacity:.45}
.rrow .rbox{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--border-s);flex:0 0 auto;margin-top:2px;
  display:grid;place-items:center;font-size:10px;color:transparent;background:var(--card)}
.rrow.in .rbox{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rrow .rn{font-size:12.5px;font-weight:600;line-height:1.35}
.rrow .rl{font-size:11px;color:var(--muted-fg);margin-top:2px;word-break:break-word}
.rrow .rflag{margin-top:5px}
.rrow .rmain{display:flex;gap:10px;align-items:flex-start;min-width:0;flex:1 1 auto;text-align:left;
  padding:0;background:none;border:0;cursor:pointer;color:inherit;font:inherit}
.rrow.out .rmain,.rrow.dec .rmain{cursor:default}
.rrow .rtx{min-width:0;flex:1 1 auto}
.rrow.dec{opacity:.62}
.rrow.dec-approved .rbox{background:var(--ok);border-color:transparent;color:var(--ok-ink)}
.rrow.dec-rejected .rbox{background:var(--bad);border-color:transparent;color:var(--bad-ink)}
.racts{display:flex;gap:5px;align-items:center;flex:0 0 auto;margin-top:1px;opacity:0;transition:opacity .12s}
.rrow:hover .racts,.rrow.cur .racts,.racts:focus-within,.racts.shown{opacity:1}
.ract{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--card);color:var(--fg-soft);font:inherit;font-size:11.5px;line-height:1;padding:4px 7px;cursor:pointer}
.ract:hover{border-color:var(--border-s);background:var(--muted)}
.ract.ok:hover{background:var(--ok);color:var(--ok-ink);border-color:transparent}
.ract.no:hover{background:var(--bad);color:var(--bad-ink);border-color:transparent}
.ract .kbd{background:color-mix(in srgb,currentColor 16%,transparent);border-radius:4px;padding:0 4px;
  font:10px/1.6 var(--mono);letter-spacing:.02em}
.ract[disabled]{opacity:.42;cursor:default}

/* campaign flow */
.flow{display:flex;flex-direction:column;gap:0;padding:4px 0}
.fnode{display:flex;gap:14px;align-items:stretch}
.fnode .spine{width:34px;display:flex;flex-direction:column;align-items:center;flex:0 0 auto}
.fnode .bead{width:30px;height:30px;border-radius:var(--pill);border:1px solid var(--border);background:var(--card);
  display:grid;place-items:center;font-size:14px;flex:0 0 auto}
.fnode .bead.gate{background:var(--warn);color:var(--warn-ink);border-color:transparent;font-weight:700}
.fnode .bead.doneb{background:var(--ok);color:var(--ok-ink);border-color:transparent}
.fnode .line{flex:1 1 auto;width:2px;background:var(--border);min-height:14px}
.fnode:last-child .line{background:transparent}
.fcard{flex:1 1 auto;border:1px solid var(--border);border-radius:var(--r);background:var(--card);
  padding:13px 15px;margin-bottom:10px;cursor:pointer}
.fcard:hover{border-color:var(--border-s);box-shadow:var(--shadow)}
.fcard.gatecard{border-color:var(--warn-ink);background:color-mix(in srgb,var(--warn) 40%,var(--card))}
.fcard .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.fcard .ttl{font-size:13.5px;font-weight:650}
.fcard .meta{font-size:11.5px;color:var(--muted-fg);margin-top:4px;line-height:1.45}
.fcard .states{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}

/* flow structure editing */
.fgap{display:flex;align-items:center;gap:10px;min-height:16px;padding-left:48px;margin:-5px 0 -1px}
.fgap .gapbtn{opacity:0;width:20px;height:20px;border-radius:var(--pill);border:1px dashed var(--border-s);
  background:var(--card);color:var(--muted-fg);font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center;
  transition:opacity .12s;flex:0 0 auto}
.fgap .gaprule{opacity:0;height:1px;flex:1 1 auto;background:var(--border-s);transition:opacity .12s}
.fgap:hover .gapbtn,.fgap:hover .gaprule,.fgap.open .gapbtn,.fgap.open .gaprule{opacity:1}
.fgap .gapbtn:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.gapmenu{border:1px solid var(--border);border-radius:var(--r);background:var(--card);padding:10px 12px;
  margin:4px 0 8px 48px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 18px rgba(0,0,0,.10)}
.gapmenu .lbl{font-size:11.5px;color:var(--muted-fg);margin-right:2px}
.fcard.dragging{opacity:.45}
.fnode.dropbefore{box-shadow:inset 0 2px 0 0 var(--accent)}
.fnode.dropafter{box-shadow:inset 0 -2px 0 0 var(--accent)}
.fcard .rowtools{display:flex;gap:4px;align-items:center;margin-left:auto}
.fcard .grip{opacity:.25;cursor:grab;font-size:13px;line-height:1;padding:1px 3px;color:var(--muted-fg)}
.fcard:hover .grip{opacity:.8}
.fcard .rowdel{opacity:0;border:1px solid var(--border);background:var(--card);color:var(--muted-fg);
  border-radius:var(--pill);font-size:11px;line-height:1;padding:3px 6px;cursor:pointer;transition:opacity .12s}
.fcard:hover .rowdel,.fcard .rowdel:focus{opacity:1}
.fcard .rowdel:hover{border-color:var(--bad-ink);color:var(--bad-ink)}

/* dual state pill: approval | execution */
.dual{display:inline-flex;border-radius:var(--pill);overflow:hidden;border:1px solid var(--border);font-size:10.5px;font-weight:650}
.dual span{padding:2px 9px;display:inline-flex;align-items:center;gap:5px;line-height:1.8}
.dual .lab{background:var(--muted);color:var(--muted-fg);font-weight:600}


/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,9,7,.45);backdrop-filter:blur(3px);z-index:90;
  display:grid;place-items:center;padding:28px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);
  width:min(880px,100%);max-height:88vh;overflow:hidden;display:flex;flex-direction:column}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:14px}
.modal-head h2{margin:0;font-size:17px;letter-spacing:-.02em;font-weight:650}
.modal-head .x{margin-left:auto;border:1px solid var(--border);background:var(--bg);width:30px;height:30px;
  border-radius:var(--pill);cursor:pointer;font-size:15px;line-height:1;flex:0 0 auto}
.modal-body{padding:20px 22px;overflow-y:auto}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);background:var(--muted);display:flex;gap:9px;align-items:center;flex-wrap:wrap}

/* kv */
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:9px 16px;font-size:12.5px}
.kv dt{color:var(--muted-fg)} .kv dd{margin:0}

/* timeline */
.tl{list-style:none;margin:0;padding:0;font-size:12.5px}
.tl li{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--border)}
.tl li:last-child{border-bottom:0}
.tl .when{color:var(--muted-fg);font-variant-numeric:tabular-nums;flex:0 0 92px;font-size:11.5px}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:9px}
.fstep{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) minmax(0,112px);gap:12px;align-items:center}
.fstep .lbl{font-size:12.5px;display:flex;align-items:center;gap:7px}
.fstep .track{height:26px;border-radius:var(--r-sm);background:var(--muted);overflow:hidden}
.fstep .track i{display:block;height:100%;background:var(--accent);opacity:.85;border-radius:var(--r-sm)}
.fstep .num{text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums}
.fstep .num b{font-size:15px;font-weight:650}
.fstep .num span{color:var(--muted-fg);font-size:11.5px}
.fstep .lbl,.fstep .num{min-width:0;overflow-wrap:anywhere}

/* bar chart */
.bars{display:flex;align-items:flex-end;gap:6px;height:132px;padding-top:8px}
.bars .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars .col small{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bars .col i{width:100%;border-radius:5px 5px 0 0;background:var(--accent);opacity:.8;display:block}
.bars .col:hover i{opacity:1}
.bars .col small{font-size:10px;color:var(--muted-fg);white-space:nowrap}

/* compliance note */
.note{display:flex;gap:11px;border:1px solid var(--border);border-left:3px solid var(--warn-ink);
  background:color-mix(in srgb,var(--warn) 34%,var(--card));border-radius:var(--r-sm);padding:12px 14px;
  font-size:12.5px;line-height:1.5;margin-bottom:14px}
.note .i{font-size:15px;flex:0 0 auto}
.note b{font-weight:650}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:120;background:var(--fg);
  color:var(--bg);padding:11px 18px;border-radius:var(--pill);font-size:12.5px;box-shadow:var(--shadow-lg);
  display:flex;align-items:center;gap:12px}
.toast button{background:none;border:0;text-decoration:underline;cursor:pointer;color:inherit;font-size:12.5px}

/* form builder */
.ffield{border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 13px;background:var(--muted);margin-bottom:8px}
.ffield .l{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.ffield .i{margin-top:7px;border:1px solid var(--border);border-radius:6px;background:var(--card);
  padding:8px 10px;font-size:12px;color:var(--muted-fg)}
.pv{border:1px solid var(--border);border-radius:var(--r);background:var(--bg);padding:20px;max-width:460px;margin:0 auto}
.pv h3{margin:0 0 4px;font-size:16px}
.pv p{margin:0 0 16px;font-size:12.5px;color:var(--muted-fg)}
.empty{padding:34px;text-align:center;color:var(--muted-fg);font-size:12.5px}
.hl{background:var(--accent-soft);border-radius:4px;padding:0 4px}

/* editable controls — same tokens, no new palette */
.inp{width:100%;border:1px solid var(--border);background:var(--card);color:var(--fg);border-radius:6px;
  padding:8px 10px;font:inherit;font-size:12.5px;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:92px;resize:vertical;line-height:1.5}
select.inp{cursor:pointer}
.lbl{display:block;font-size:11.5px;color:var(--muted-fg);margin-bottom:5px}
.btn[disabled]{opacity:.42;cursor:default}
.btn[disabled]:hover{background:var(--card);border-color:var(--border)}
.iconb{border:1px solid var(--border);background:var(--card);border-radius:6px;width:27px;height:27px;
  display:grid;place-items:center;cursor:pointer;font-size:12px;padding:0;flex:0 0 auto}
.iconb:hover{border-color:var(--border-s);background:var(--muted)}
.iconb[disabled]{opacity:.3;cursor:default}
.fld{border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 13px;background:var(--muted);margin-bottom:9px}
.fld .hd{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.fld .hd .gr{margin-left:auto;display:inline-flex;gap:6px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:12px;cursor:pointer;margin-top:9px}
.chk input{width:14px;height:14px;accent-color:var(--accent);cursor:pointer}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:20px;align-items:start}
@media(max-width:1240px){.split{grid-template-columns:minmax(0,1fr)}}
.route{display:block;width:100%;text-align:left;padding:15px 17px;cursor:pointer;margin-bottom:10px}
.route:hover{border-color:var(--accent);background:var(--accent-soft)}
.route .rt{font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:8px}
.route .rd{font-size:12px;color:var(--muted-fg);margin-top:5px;line-height:1.5}

/* run 485: shared list controls — sort headers, result line, selection */
table.t th.sth{cursor:pointer;user-select:none;white-space:nowrap}
table.t th.sth:hover{color:var(--fg)}
table.t th.sth .ar{opacity:.35;margin-left:4px;font-size:9px}
table.t th.sth.on{color:var(--fg)} table.t th.sth.on .ar{opacity:1}
table.t tbody tr.sel td{background:var(--accent-soft)}
table.t tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.cb{appearance:none;width:16px;height:16px;margin:0;border:1px solid var(--border-s);border-radius:5px;background:var(--card);
  cursor:pointer;display:inline-grid;place-content:center;vertical-align:middle}
.cb:checked{background:var(--accent);border-color:var(--accent)}
.cb:checked::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.rline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted-fg);margin:0 0 10px}
.rline b{color:var(--fg)}
.rline .ssel{border:1px solid var(--border);background:var(--card);border-radius:var(--pill);padding:4px 10px;font:inherit;font-size:12px;color:var(--fg);margin-left:auto}
.card.selc{border-color:var(--accent);background:var(--accent-soft)}
.dim{opacity:.38}
.cardcb{position:absolute;top:12px;right:12px}
</style>
</head>
<body>
<div id="root"></div>
<script type="application/json" id="agent-map">
{
 "about": "Madaket Contacts & Campaigns prototype. Navigate by setting location.hash; a fresh load of any route restores that screen+state. Back/forward work. Every interactive element has data-testid; list rows/cards carry data-id=<entity id>.",
 "js": {
  "routeOf": "window.pgRouteOf() -> current hash",
  "go": "window.pgApply('#/...', true) applies a route (true = fresh data)",
  "flow": "window.pgGo(i) jumps to Flows step i (0-57)"
 },
 "routes": {
  "#/triage[/<triageId>]": "Triage inbox, item open (t1..t11)",
  "#/contacts": "Contacts list",
  "#/contacts/<contactId>": "Contact detail modal (c1..c12)",
  "#/contacts/new": "New contact modal",
  "#/contacts/remove?ids=c1,c2": "Remove-from-lists modal",
  "#/<screen>/import/<1-4>[?k=<kind>]": "Import wizard step (kind defaults to screen)",
  "#/segments": "Segments",
  "#/segments/<segId>[/suppressed]": "Segment detail (s1..s5)",
  "#/segments/new": "Segment builder",
  "#/segments/<segId>/edit[?match=any]": "Edit rules",
  "#/campaigns": "Campaigns",
  "#/campaigns/new": "New campaign",
  "#/campaigns/<campaignId>": "Campaign detail (k1..k3)",
  "#/campaigns/<campaignId>/step/<index>": "Step editor modal",
  "#/forms": "Forms",
  "#/forms/<formId>": "Form detail (f1..f4)",
  "#/forms/new": "New form",
  "#/forms/<formId>/send": "Send a form",
  "#/performance": "Performance funnel",
  "#/flow/<area>/<step>": "Named Flows state that involves a mutation or toast (approve, undo, import done...)"
 },
 "query": {
  "f": "JSON array of filters for the current list [{p,op,v}] (steps list when inside a campaign)",
  "f.<screen>": "filters for another list",
  "view": "saved view id (contacts: ns, wk; triage: open, hi; campaigns: att, arch)",
  "q": "search text",
  "edit": "open filter editor: <chipIndex>.<prop|op|val> or add",
  "sel": "selected row ids, comma list",
  "fail": "1 = contacts load error state",
  "match": "any = OR in segment builder",
  "ids": "contacts for remove modal",
  "k": "import kind"
 },
 "testids": {

function reachBy(total){ const sh=REACH_DEMO.share, out={}; let sum=0;

function reachHTML(){ const R=REACH_DEMO, f=n=>n.toLocaleString("en-US");

  const bar=(l,v,w,c)=>`<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span style="width:84px;font-size:12px">${l}</span><div style="flex:1;background:#efe7da;border-radius:4px;height:16px"><div style="width:${w}%;min-width:3px;height:16px;border-radius:4px;background:${c}"></div></div><span class="tabular" style="width:60px;text-align:right;font-size:12px">${f(v)}</span></div>`;

function mapVals(){ const m=S.mapMetric||"leads", by={}; CONTACTS.forEach(c=>{ const st=c.state||"CT"; (by[st]=by[st]||[]).push(c); });

      ${m!=="leads"&&sel?`<div style="font-size:12px;color:var(--muted-fg);margin-bottom:6px">Sample: ${Math.round((v[sel]||0)/REACH_DEMO[m]*100)}% of all ${m}. Leads in this state: ${list.length}</div>`:""}

function mapLabels(){

function nc2Validate(){ const n=S.newC, e={}, em=n.email.trim().toLowerCase();
  if(!n.name.trim()) e.name="Enter a name.";
  if(!em) e.email="Enter an email."; else if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(em)) e.email="That doesn't look like an email address.";
  else { const d=CONTACTS.find(c=>c.email.toLowerCase()===em||(c.alt||"").toLowerCase()===em); if(d) e.email=`${esc(d.name)} already has this email. Open that contact instead.`; }
  if(n.phone.trim() && n.phone.replace(/\D/g,"").length!==10) e.phone="Use a 10-digit US number.";
  if(!n.org.trim()) e.org="Enter a district or school.";
  if(n.cons==="subscribed" && !n.ok) e.ok="Tick this, or set consent to On hold.";
  n.err=e; return !Object.keys(e).length; }

/* ── segment builder: rule rows, live count, save / edit ───────────── */
const SB_BASE = ()=>LIFECYCLE.reduce((a,x)=>a+x.n,0);
const SB_SUPP=["unsubscribed","bounced","removed"];
function sbCount(rules,match){
  const done=rules.filter(fDone); if(!done.length) return {n:0,sup:0,m:0};
  const hit=c=>{ const r=done.map(f=>fTest(pOf("contacts",f.p),f,c)); return match==="any"?r.some(Boolean):r.every(Boolean); };
  const m=CONTACTS.filter(hit), k=1, sup=m.filter(c=>SB_SUPP.includes(c.cons)).length;
  return {n:Math.round((m.length-sup)*k), sup:Math.round(sup*k), m:m.length};
}
const sbText = (r)=> fText(pOf("contacts",r.p),r);
const sbInUse = (s)=> s ? CAMPAIGNS.filter(k=>k.seg===s.name && k.state!=="Archived") : [];
function segBuilderModal(){
  const b=S.sb; if(!b) return "";
  const c=sbCount(b.rules,b.match), editing=!!b.id, seg=editing?SEGMENTS.find(x=>x.id===b.id):null;
  const running=sbInUse(seg).filter(k=>k.state==="Running");
  const bad=b.rules.some(r=>!fDone(r)), ok=b.name.trim()&&b.rules.length&&!bad;
  return `<div class="scrim" data-close="1"><div class="modal" data-stop="1" style="width:min(720px,100%)">
    <div class="modal-head"><div><h2>${editing?"Edit rules":"New segment"}</h2>
      <div style="font-size:12.5px;color:var(--muted-fg);margin-top:3px">Contacts who match the rules below. The count updates as you go.</div></div>
      <button class="x" data-close="1">✕</button></div>
    <div class="modal-body">
      <label class="lbl">Segment name</label>
      <input class="inp" id="sb-name" data-bind="sb-name" value="${esc(b.name)}" placeholder="e.g. Attended, not yet booked">
      <div style="display:flex;align-items:center;gap:8px;margin:18px 0 10px">
        <span class="sect" style="margin:0">Rules</span>
        ${b.rules.length>1?`<span style="margin-left:auto;display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted-fg)">Match
          <button class="chip ${b.match==="all"?"on":""}" data-act="sb-match" data-v="all">all of these</button>
          <button class="chip ${b.match==="any"?"on":""}" data-act="sb-match" data-v="any">any of these</button></span>`:""}
      </div>
      ${fchips("sb",{or:b.match==="any", add:b.rules.length?"Add a rule":"Add the first rule"})}
      ${b.rules.length?"":`<div class="empty" style="border:1px dashed var(--border);border-radius:var(--r);margin-top:8px">No rules yet. Add the first one.</div>`}
      ${bad?`<div style="font-size:11.5px;color:var(--bad-ink);margin-top:6px">Pick a value for this rule: ${b.rules.filter(r=>!fDone(r)).map(r=>esc(pOf("sb",r.p).label)).join(", ")}</div>`:""}
      <div class="note" style="margin-top:18px"><span class="i">👥</span><div>
        ${editing?`<span class="tabular">${seg.n.toLocaleString()}</span> → `:""}<b class="tabular" id="sb-count">${c.n.toLocaleString()} contacts</b>
        · <span class="tabular">${c.sup}</span> suppressed (unsubscribed, bounced, removed).
        <div style="font-size:11.5px;color:var(--muted-fg);margin-top:4px">${c.m} of the ${CONTACTS.length} contacts in this list match these rules.</div>
        <div style="font-size:11.5px;color:var(--muted-fg);margin-top:4px">Unsubscribed contacts are always excluded, whatever the rules say.</div>
        ${b.rules.length&&!bad&&c.n===0?`<div style="margin-top:6px;color:var(--warn-ink,#8a5a00)">This segment is empty today. It will fill as contacts match.</div>`:""}</div></div>
      ${running.length?`<div class="note" style="margin-top:10px"><span class="i">⚠️</span><div>Used by <b>${running.map(k=>esc(k.name)).join(", ")}</b> (running).

}

function gateBarHTML(k,s,where){
  if(!s.gate) return "";
  const t = s.tri && TRIAGE.find(x=>x.id===s.tri), dec = t && S.triDone[t.id];
  if(!t){
    if(s.ap!=="pending") return "";
    const why = k.state==="Paused"?"Campaign is paused. Resume it before this gate can be decided."

    return `<div class="gatebar"><button class="btn pri sm" disabled>Approve</button><button class="btn sm" disabled>Reject…</button>
      <span style="font-size:11.5px;color:var(--muted-fg)">${why}</span></div>`;
  }
  if(dec) return `<div class="gatebar"><span class="b ${dec==="approved"?"b-ok":"b-bad"}">${dec==="approved"?"Approved · queued in FMG, not sent":"Rejected"}</span>

      <button class="btn sm" data-act="goto-triage" data-id="${t.id}">See it in Triage</button></div>`;

  if(r) return `<div class="gatebar">

      <button class="btn sm" data-act="gate-reject-cancel">Cancel</button></div>`;
  return `<div class="gatebar">
      <button class="btn pri sm" data-act="gate-approve" data-id="${t.id}" ${t.bundle&&bunInN(t)===0?"disabled":""}>Approve${t.bundle?` ${bunInN(t)} of ${bunAll(t)}`:""}</button>

      <button class="btn sm" data-act="goto-triage" data-id="${t.id}" style="margin-left:auto">Open in Triage</button></div>`;
}

const STEP_TYPES = ["Email","Form","Invitation","File"];
const STEP_ICON  = t=>({Email:"✉️",Form:"📋",Invitation:"📅",File:"📎",Gate:"✋"}[t]||"•");
let kSeq = 13, fSeq = 4, tSeq = 100, sSeq = 6;

function stepSummary(s){
  if(s.gate) return s.meta || "Someone has to approve here before anything after it can run.";
  if(s.t==="Email")      return s.subj ? `Subject: ${esc(s.subj)}` : (s.meta||"No subject written yet.");
  if(s.t==="Form"){ const f=FORMS.find(x=>x.id===s.formId); return f?`Sends the form: ${esc(f.name)}`:(s.meta||"No form chosen yet."); }
  if(s.t==="File")       return s.file ? `Attaches ${esc(s.file)}` : (s.meta||"No file chosen yet.");
  if(s.t==="Invitation") return s.session ? `Session: ${esc(s.session)}` : (s.meta||"No session details yet.");
  return s.meta||"";
}
function touchStep(s){
  s.ap="pending"; if(s.tri&&S.triDone[s.tri]) delete S.triDone[s.tri]; s.ex="none";
  if(!s.edited){ s.edited=true; s.meta="Edited here · nothing has been sent since."; }
}
function blankStep(type){
  return type==="Gate"
    ? {t:"Gate", n:"Approve before this point", meta:"Waiting on Jordan or Frank.", gate:true, ap:"pending", ex:"none"}
    : {t:type||"Email", n:"New step", meta:"Nothing written yet.", gate:false, ap:"pending", ex:"none", subj:"", body:""};
}
function insertStep(k,i,step){ k.steps.splice(i,0,step); }


function gapHTML(k,i){
  const before = i>0 ? `after “${esc(k.steps[i-1].n)}”` : "at the very start";
  const after  = i<k.steps.length ? `before “${esc(k.steps[i].n)}”` : "at the very end";
  const where  = i===0 ? `Insert ${after}` : (i===k.steps.length ? `Insert ${before}` : `Insert ${before}, ${after}`);
  const open = S.gapOpen===i;
  return `<div class="fgap ${open?"open":""}" data-gapzone="${i}">
      <button class="gapbtn" data-act="gap-open" data-i="${i}" title="${where}">＋</button>
      <span class="gaprule"></span>
    </div>` + (open?`<div class="gapmenu">
      <span class="lbl">${where}:</span>
      ${STEP_TYPES.map(t=>`<button class="btn sm" data-act="gap-ins" data-i="${i}" data-kind="${t}">${STEP_ICON(t)} ${t}</button>`).join("")}
      <button class="btn sm" data-act="gap-ins" data-i="${i}" data-kind="Gate">✋ Gate</button>
      <button class="btn sm" data-act="gap-open" data-i="${i}">Cancel</button>
    </div>`:"");
}
/* every structural change re-opens the affected steps for approval */
function touchAround(k,i){ [k.steps[i-1],k.steps[i],k.steps[i+1]].forEach(s=>{ if(s) touchStep(s); }); }
function moveStep(k,from,to){
  if(from===to||from<0||to<0||from>=k.steps.length) return;
  const [m]=k.steps.splice(from,1);
  if(to>from) to--;
  k.steps.splice(to,0,m);
  touchStep(m);
  const lo=Math.min(from,to), hi=Math.max(from,to);
  for(let j=lo;j<=hi&&j<k.steps.length;j++) touchStep(k.steps[j]);
}

function triCounts(){
  const pend = TRIAGE.filter(t=>!S.triDone[t.id]);
  return {pend:pend.length, hi:pend.filter(t=>t.conf>=85).length,
          md:pend.filter(t=>t.conf>=55&&t.conf<85).length, lo:pend.filter(t=>t.conf<55).length};
}
function fillVars(txt){
  const c = triCounts();
  return txt.replace(/\{\{(pend|hi|md|lo)\}\}/g,(_,k)=>c[k]);
}

function wireFlowDnD(){
  const flow=document.getElementById("flow"); if(!flow) return;
  const clear=()=>flow.querySelectorAll(".fnode").forEach(n=>n.classList.remove("dropbefore","dropafter"));
  flow.querySelectorAll(".fcard[draggable]").forEach(card=>{
    card.addEventListener("dragstart",e=>{ S.dragFrom=+card.dataset.step; card.classList.add("dragging");
      e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",card.dataset.step);}catch(_){} });
    card.addEventListener("dragend",()=>{ card.classList.remove("dragging"); S.dragFrom=null; clear(); });
  });
  flow.querySelectorAll(".fnode").forEach(node=>{
    node.addEventListener("dragover",e=>{
      if(S.dragFrom===null) return; e.preventDefault(); e.dataTransfer.dropEffect="move";
      const r=node.getBoundingClientRect(), after=(e.clientY-r.top)>r.height/2;
      clear(); node.classList.add(after?"dropafter":"dropbefore");
    });
    node.addEventListener("dragleave",()=>node.classList.remove("dropbefore","dropafter"));
    node.addEventListener("drop",e=>{
      if(S.dragFrom===null) return; e.preventDefault();
      const r=node.getBoundingClientRect(), after=(e.clientY-r.top)>r.height/2;
      const to=(+node.dataset.node)+(after?1:0), from=S.dragFrom;
      S.dragFrom=null; clear();
      const k=CAMPAIGNS.find(x=>x.id===S.openCampaign); if(!k) return;
      if(to===from||to===from+1){ render(); return; }
      const pre=snapNow(), nm=k.steps[from].n; moveStep(k,from,to); S.gapOpen=null;
      toast(`Moved “${nm}”. Everything it passed is back to unapproved.`, pre); render();
    });
  });
}

function csvParse(t){ const R=[]; let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){ const ch=t[i];
    if(q){ if(ch=='"'){ if(t[i+1]=='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch=='"') q=true; else if(ch==','){ r.push(f); f=""; }
    else if(ch=='\n'||ch=='\r'){ if(ch=='\r'&&t[i+1]=='\n') i++; r.push(f); f=""; if(r.some(x=>x.trim())) R.push(r); r=[]; }
    else f+=ch; }
  r.push(f); if(r.some(x=>x.trim())) R.push(r); return R; }

function impCons(v){ v=(v||"").trim().toLowerCase(); if(!v) return "";
  if(/^(sub|subscribed|yes|y|opted in|opt-in|true)$/.test(v)) return "subscribed";
  if(/unsub|opted out|opt-out|^no$|^n$/.test(v)) return "unsubscribed";
  if(/bounce/.test(v)) return "bounced"; if(/hold|held/.test(v)) return "held"; return "?"; }
const IMP_TYPES=["Email","Gate","Invitation","Form","File"];
function impSteps(v){ v=(v||"").trim(); if(!v) return {err:"Steps are missing"};
  let arr;

  else arr=v.split(">").map(x=>{ const m=x.split(":"); return {t:(m[0]||"").trim(), n:m.slice(1).join(":").trim()}; });
  for(const s of arr){ const t=IMP_TYPES.find(x=>x.toLowerCase()===String(s.t||"").toLowerCase());
    if(!t) return {err:`Unknown step type “${esc(s.t||"")}” (use ${IMP_TYPES.join(", ")})`}; s.t=t; if(!s.n) return {err:`A ${t} step has no name`}; }
  return {steps:arr}; }

function toggleRow(tid,rid){
  if((S.triRowD[tid]||{})[rid]) return;   /* a row decided on its own is out of the group's scope */

/* decide ONE contact inside the bundle card. Approval only, execution stays Not started. */
function decideRow(tid,rid,how){
  const t=TRIAGE.find(x=>x.id===tid); if(!t||S.triDone[tid]) return;
  const r=(t.roster||[]).find(x=>x.id===rid); if(!r) return;
  S.triRowD[tid]=S.triRowD[tid]||{};

  const left=bunInN(t);
  if(left===0 && !t.more){ finishBundleByRow(t); return; }
  toast(`${how==="approved"?"Approved":"Rejected"} ${r.nm} on its own. ${left} still in the group action.`);
}
function undoRow(tid,rid){
  if(S.triRowD[tid]) delete S.triRowD[tid][rid];

}
/* every row handled by hand: the card resolves itself and leaves the queue */
function finishBundleByRow(t){
  const ok=bunDecBy(t,"approved"), no=bunDecBy(t,"rejected");
  const outN=spawnExcluded(t);
  S.triDone[t.id]= ok?"approved":"rejected";
  delete S.triSel[t.id]; S.triRow=null;
  toast(`All ${bunAll(t)} handled one by one: ${ok} approved, ${no} rejected. Queued in FMG, nothing sent yet.${outN?` ${outN} excluded ${outN===1?"contact is":"contacts are"} back in the queue.`:""}`, true);

function spawnExcluded(t){
  const out=(t.roster||[]).filter(r=>bunOut(t,r));
  out.forEach(r=>{
    const id=`${t.id}-x-${r.id}`;
    if(TRIAGE.find(x=>x.id===id)) return;
    TRIAGE.push({id, kind:t.kind, conf:t.conf, spawned:true,
      title:`${r.nm} — pulled out of the bundle`,

      why:`Held back from <b>${t.title}</b>, so the bundle decision did not touch this record.${r.flag?` The reason flagged on the row: <b>${r.flag}</b>.`:""} It is on its own now and nothing has been written to it.`,
      action:t.action,

/* a consent change asked for from Contacts: a real Triage item, applied only on approval */
function consentReq(ids,to,reason){
  const cs=ids.map(i=>CONTACTS.find(c=>c.id===i)).filter(Boolean);
  const verb={held:"Put on hold",subscribed:"Release hold",removed:"Remove from lists"}[to];
  const who=cs.length===1?cs[0].name:`${cs.length} contacts`, id="t"+(tSeq++);
  cs.forEach(c=>c.pend=verb);
  TRIAGE.push({id, kind:"Consent", conf:99, title:`${verb}: ${who}`, cids:cs.map(c=>c.id), to,
    sum:`Requested by Jordan from Contacts${reason?` · reason: ${esc(reason)}`:""}`,
    why:`Jordan asked for this on ${cs.map(c=>"<b>"+esc(c.name)+"</b>").join(", ")}. Consent does not change until it is approved here.`,
    action:`Move consent to <b>${cons(to).label}</b>${to==="removed"?". Not a delete: the record and its history stay.":""}.`,
    a:{nm:who,ln:cs.map(c=>c.email).join(" · ")}, b:{nm:cons(to).label,ln:cons(to).why},

function applyConsent(t,how){ if(!t.cids) return;
  t.cids.forEach(i=>{ const c=CONTACTS.find(x=>x.id===i); if(!c) return; delete c.pend; if(how==="approved") c.cons=t.to; }); }
function decide(id,how){

    toast(how==="approved"
      ? `Approved ${inN} of ${allN}: ${t.title}. Queued in FMG, not sent yet.${tailmsg}`
      : `Rejected ${inN} of ${allN}: ${t.title}. Nothing will happen.${tailmsg}`, true);
    nextTri(); return;
  }
  S.triDone[id]=how; delete S.triSel[id];
  toast(how==="approved"?`Approved: ${t.title}. Queued in FMG, not sent yet.`:`Rejected: ${t.title}. Nothing will happen.`,true);
  nextTri();
}

document.addEventListener("change",(e)=>{

    g.members.push(v); g.n+=1; toast(`Added ${esc(ct.name)} to “${esc(g.name)}” (now ${g.n.toLocaleString()}).`,true); return; }

  if(c==="k-seg"){ S.kSegPick=v||null; render(); return; }

document.addEventListener("keydown",(e)=>{
  if(e.target.tagName==="INPUT") return;
  if(S.openContact||S.openSegment||S.openStep!==null||S.sendForm||S.nc||S.fb||S.sb||S.rm||S.newC||S.imp){
    if(e.key==="Escape"){ if(closeGuard()){ closeModals(); render(); } }
    return;
  }
  if(S.view!=="triage") return;
  const cur=S.triOpen;
  const curT=TRIAGE.find(x=>x.id===cur);
  const bun=curT&&curT.bundle&&!S.triDone[cur]?curT:null;
  if(bun&&(e.key==="ArrowDown"||e.key==="ArrowUp")){
    e.preventDefault();
    const n=(bun.roster||[]).length;
    S.triRow = S.triRow===null ? (e.key==="ArrowDown"?0:n-1)
             : Math.max(0,Math.min(n-1,S.triRow+(e.key==="ArrowDown"?1:-1)));
    render();
    const el=document.querySelector(".rrow.cur"); if(el) el.scrollIntoView({block:"nearest"});
    return; }
  if(bun&&S.triRow!==null&&e.shiftKey&&(e.key==="A"||e.key==="R")){
    e.preventDefault();
    const row=bun.roster[S.triRow];
    if(bunDec(bun,row)) undoRow(bun.id,row.id);
    else decideRow(bun.id,row.id,e.key==="A"?"approved":"rejected");
    render();
    const el=document.querySelector(".rrow.cur"); if(el) el.scrollIntoView({block:"nearest"});
    return; }
  if(bun&&S.triRow!==null&&(e.key===" "||e.key==="x"||e.key==="X")){
    e.preventDefault(); toggleRow(bun.id,bun.roster[S.triRow].id); render();
    const el=document.querySelector(".rrow.cur"); if(el) el.scrollIntoView({block:"nearest"});
    return; }
  if(e.key==="j"||e.key==="J"){ e.preventDefault(); nextTri(); render(); }
  else if(e.key==="k"||e.key==="K"){ e.preventDefault(); prevTri(); render(); }
  else if(!e.shiftKey&&(e.key==="a"||e.key==="A")){ e.preventDefault();
    const sel=Object.keys(S.triSel).filter(k=>S.triSel[k]&&!S.triDone[k]);
    if(sel.length){ sel.forEach(i=>{S.triDone[i]="approved"; applyConsent(TRIAGE.find(x=>x.id===i),"approved");}); S.triSel={}; toast(`${sel.length} items approved and queued in FMG.`,true); nextTri(); }
    else if(!S.triDone[cur]) decide(cur,"approved");
    render(); }
  else if(!e.shiftKey&&(e.key==="r"||e.key==="R")){ e.preventDefault();
    const sel=Object.keys(S.triSel).filter(k=>S.triSel[k]&&!S.triDone[k]);
    if(sel.length){ sel.forEach(i=>{S.triDone[i]="rejected"; applyConsent(TRIAGE.find(x=>x.id===i),"rejected");}); S.triSel={}; toast(`${sel.length} items rejected.`,true); nextTri(); }
    else if(!S.triDone[cur]) decide(cur,"rejected");
    render(); }
  else if(e.key===" "){ e.preventDefault(); S.triSel[cur]=!S.triSel[cur]; render(); }
});

    <div class="gl">${GUIDE.map((g,ai)=>`<div class="ga"><span>${g.a}</span><span>${g.s.length}</span></div>${flat.map((x,i)=>x.ai!==ai?"":`<a class="gs ${i===U.cur?"on":""}" href="${esc(x.route)}" data-gi="${i}" aria-label="${esc(x.a)} step ${x.si+1}: ${esc(x.n)} (${x.tc})" ${i===U.cur?'aria-current="step"':""}><span class="no">Step ${x.si+1}</span><span>${esc(x.n)}</span><span class="tc">${x.tc}</span></a>`).join("")}`).join("")}</div></div>`;
  const on=box.querySelector(".gs.on"); if(on) on.scrollIntoView({block:"nearest"}); a11y(box); }
box.addEventListener("click",(e)=>{ e.stopPropagation(); const b=e.target.closest("[data-g],[data-gi]"); if(!b) return; const g=b.dataset.g;
  if(b.dataset.gi!==undefined){ e.preventDefault(); return go(+b.dataset.gi); }
  if(g==="open"){ U.open=true; draw(); } else if(g==="close"){ U.open=false; draw(); }
  else if(g==="prev") go(U.cur-1); else if(g==="next") go(U.cur+1); });
document.addEventListener("keydown",(e)=>{ if(!U.open||e.key!=="Escape") return;
  const busy=S.fe||S.openContact||S.openSegment||S.openStep!==null||S.sendForm||S.nc||S.fb||S.sb||S.rm||S.newC||S.imp;
  if(box.contains(e.target)||!busy){ e.preventDefault(); e.stopImmediatePropagation(); U.open=false; draw(); } },true);
draw();
if(location.hash.length>2) applyRoute(location.hash,true); else sync();
if(document.fonts) document.fonts.ready.then(()=>{ if(S.fe) fPlace(); });
})();
</script>
